name: Build daily page

on:
  schedule:
    # Two UTC crons to cover both BST (UTC+1) and GMT (UTC+0). The gate
    # step below checks the real UK wall clock and skips whichever of
    # the two doesn't actually land at 08:00 Europe/London that day.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this schedule matches today's UK time offset
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Use which cron fired (unaffected by GitHub's scheduling delay)
            # plus today's actual UK UTC offset, rather than the live clock -
            # a delayed run would otherwise see the wrong hour and skip.
            schedule="${{ github.event.schedule }}"
            uk_offset=$(TZ='Europe/London' date +%z)
            if { [ "$schedule" = "0 7 * * *" ] && [ "$uk_offset" = "+0100" ]; } || \
               { [ "$schedule" = "0 8 * * *" ] && [ "$uk_offset" = "+0000" ]; }; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Schedule '$schedule' doesn't match today's UK offset ($uk_offset) - skipping."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Build page
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT }}
        run: python build.py

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html feed_health.log
          git diff --staged --quiet || git commit -m "Digest for $(date -u +%F)"
          git push
